# =============================================================================
# officialA.yaml — R2-SK04 目标基准 A 声明指纹（任务口径验收参考：hiascend 官方帖）
# -----------------------------------------------------------------------------
# 角色：官方 hiascend 交流圈"赛事小助手"（官方账号）2026-06-27 帖《精度测试日志》
#       （运行日期 2026-06-08）内嵌的完整训练日志 = 基准 A 的【配置原文 + 数值原文】。
#       数值 CSV：docs/raw/reference_log_iterations.csv（loss 12.42247→9.068525，
#       单卡 ~11.5s/步）＝ R1-SK02 frozen_baseline.json 冻结的验收参考（status=proposed）。
# 读取方：scripts/fingerprint_cfg.py / scripts/judge_comparable.py（与 officialB 同 schema）。
# 出处标注约定：
#   * 帖 JSON 本身是单行（无原生行号）→ 本 skill 提供行级提取产物
#     evidence/officialA_configuration_details.txt（scripts/extract_postA_log.py 生成，
#     与帖子正文逐字符一致，--check 可复核防漂移）。evidence[].line 均指该证据文件行号；
#     line=0 表示"全文不存在该字段"（如 gdn/causal：A 全程未设置 → 缺省）。
#   * evidence[].file 含 "hiascend_post_精度测试日志.json" 的条目 = 帖子原始抓取件
#     （docs/raw/ 下，供复核；无行号）。
#   * A2 审计引用 = docs/audit_round1_v3_A2.md（§2.1/§3.1 口径）与 skill_R1-SK02
#     frozen_baseline.json / evidence/audit_report.txt。
# 诚实标注（officiality / 语义）：
#   * officiality=confirmed：帖子来自 hiascend 官方账号"赛事小助手"（hiascend_post_
#     精度测试日志.json data.result.author.nickName="赛事小助手"，authorId=508be4…），
#     且其《功能、精度验证和性能指标说明》帖（2026-06-27）明示"长跑 100 步，loss 与
#     grad_norm 的相对绝对误差 <2%" —— A 是仓库内唯一经官方账号帖正文确认的验收参考。
#   * 注意（不可离线判定项，A2 审计 §2.3）：A 的 loss 平台 12.42 与"日志亦打印 dcp 加载
#     （L504 Loaded checkpoint …/release）"不相容（预训练续训预期 ~1.x）——12.4 平台根因
#     （从零设计 vs 加载静默失效/权重版本/loss 口径）离线不可判定，需官方澄清或 A2 实测
#     复现；确认前一切报告用"双基准标注"。
#   * A 的配置与官方 PDF §3.3（2026-07 Triton 版）【不同阶段】：A=2026-06 单卡 mbs1/gas8、
#     gdn 缺省、loss_type=raw、无 chunk loss；B/PDF=2026-07 双卡 triton、loss_type=default。
#     本文件只声明 A 帖原文，不把 PDF 值混入。
# =============================================================================

schema: sk04_baseline.v1
baseline_id: officialA
officiality: confirmed          # confirmed（hiascend 官方账号"赛事小助手"帖《精度测试日志》2026-06-27）
officiality_note: >-
  官方账号帖内嵌日志（2026-06-08 运行）+ 配套《功能、精度验证和性能指标说明》帖验收口径
  （100 步、loss/grad_norm 相对绝对误差 <2%）→ A 为任务口径唯一官方确认的验收参考；
  但 12.42 平台根因未定（audit §2.3），验收语义仍需官方最终澄清（双基准标注期）。
role: 任务口径验收参考（从零/随机初始化尺度 12.x；单卡 ~11.5s/步）
declared_by: CA3 (R2-SK04)
declared_at: "2026-09-02"

source:
  post_json: docs/raw/hiascend_post_精度测试日志.json        # 单行 JSON（官方账号帖抓取件）
  post_author: 赛事小助手 (hiascend 官方账号, authorId 508be4615daa4d609d8983abd7a8bfb0)
  post_published: "2026-06-27"
  log_run_date: "2026-06-08"
  extracted_evidence: code/skills/R2/skill_R2-SK04/evidence/officialA_configuration_details.txt
  csv: docs/raw/reference_log_iterations.csv
  csv_sha256: c066cc2bef935f2e20502428f19fe5c6b23e38b0372d314e3ae507fae01eab34   # 本地实算一致
  frozen_baseline: code/skills/R1/skill_R1-SK02/frozen_baseline.json            # status=proposed
  config_file_logged: examples/qwen3_5/qwen3_5_0.8B_config.yaml
  model_path: /workspace/mnt/share/weights/Qwen3.5-0.8B
  load_dcp: /workspace/mnt/share/weights/Qwen3.5-0.8B-dcp/release
  loss_band: A                                                 # step1(lr=0)=12.42247 ≥5 → A 带（从零/随机初始化尺度）
  step1_evidence_line: 509                                     # 证据文件 L509：iteration 1/100
  step100_evidence_line: 609                                   # 证据文件 L609：iteration 100/100

# ---------------------------------------------------------------------------
# 7 项偏离维度声明指纹（与 officialB 同键集；行号 = evidence/officialA_configuration_details.txt）
# ---------------------------------------------------------------------------
fingerprint:
  shuffle:
    value: false
    note: A 帖内嵌日志同样关闭 shuffle（shuffle=False + BaseRandomBatchSampler）
    evidence:
      - file: code/skills/R2/skill_R2-SK04/evidence/officialA_configuration_details.txt
        line: 153
        quote: "shuffle: False"
      - file: hiascend_post_精度测试日志.json
        line: 0
        quote: "字段 shuffle: False（帖 JSON 单行无行号；键值定位）"

  freeze:
    value: []                    # ← A 未冻结任何模块（与 B/PDF 的 [model.visual] 不同）
    note: >-
      A 帖原文 freeze=[]（2026-06 阶段旧模板）；官方 2026-07 Triton 版（B/PDF §3.3）才是
      freeze=[model.visual]。引用时勿把两阶段混写。
    evidence:
      - file: code/skills/R2/skill_R2-SK04/evidence/officialA_configuration_details.txt
        line: 81
        quote: "freeze: []"
      - file: code/skills/R1/skill_R1-SK02/evidence/audit_report.txt
        line: 41
        quote: "world_size=1 | gdn_implementation=缺省(未设置) | dataset=annotations_slim.json (dir=./) | train_iters=100"

