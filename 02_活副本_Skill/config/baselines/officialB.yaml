      待拿到官方 json 后用 scripts/data_id.py 输出回填 byte_sha256/order_sha256。
    evidence:
      - file: docs/official/triton精度日志.txt
        line: 105
        quote: "dataset: ['/data/s00977099/output_llava_coco_data.json']"
      - file: docs/official/triton精度日志.txt
        line: 104
        quote: "dataset_dir: /home/dataset/llava_coco/coco/"
      - file: docs/audit_round1_v3_A2.md
        line: 92
        quote: "官方 B 数据集文件 output_llava_coco_data.json（我方 annotations_slim.json 身份未核对）"
      - file: docs/official_templates_parsed.md
        line: 309
        quote: "数据：LLaVA-COCO（/home/dataset/llava_coco/coco/ + /data/s00977099/output_llava_coco_data.json）"

  num_workers:
    value: 8
    note: dataloader num_workers=8；preprocess_num_workers=16（性能项，理论不影响数值）
    evidence:
      - file: docs/official/triton精度日志.txt
        line: 175
        quote: "num_workers: 8"
      - file: docs/official/triton精度日志.txt
        line: 112
