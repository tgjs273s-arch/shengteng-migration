# 派生指纹（每步样本数 / 打印语义 / 数值带）
# ---------------------------------------------------------------------------
derived:
  n_eff:
    value: 8
    formula: "world(2) × mbs(4) × gas(1)"
    note: 与 CSV Samples 列每步 +8 一致（R2-C4-01 批量证伪依据：官方每步样本数=8）
    evidence:
      - file: docs/official/triton精度日志.txt
        line: 602
        quote: "iteration 1/100 | consumed samples: 8 | … | global batch size: 8 | loss: 1.924621E+00 | grad norm: 134.266"
      - file: code/skills/skill_round2_SM3/reference_official_100steps.csv
        line: 2
        quote: "1,8,119405.2,0.0,8,1.924621,134.266"
  gbs_eff: 8
  world_size: 2
  loss_print_semantics: >-
    dp=2：每步打印 rank0 的本地位 loss（其分片 batch 的均值），非全局 8 样本均值
    （日志未见打印前 all-reduce 证据）—— 1 卡想逐点复现 2 卡日志须重建 rank0 切片语义
    （A2 审计 §3.2）
  loss_band: B
  step1_lr0: {loss: 1.924621, grad_norm: 134.266, source_csv_line: 2}
  step100: {loss: 1.448866, grad_norm: 10.077, source_csv_line: 101}
  kernel_evidence_lines:   # NPU triton 生效标记（本日志无 roll back to CPU）
    - file: docs/official/triton精度日志.txt
      line: 365
      quote: "Qwen3_5 causal_conv1d use NPU triton ops"
    - file: docs/official/triton精度日志.txt
      line: 366
      quote: "Qwen3_5GatedDeltaNet use NPU triton fused ops"

